# Model policy - which models may author code in this repository. OPTIONAL (opt-in).
# Validated by the check-model-provenance capability; enforced by `trellis model-check`.
# Provenance is stored out-of-band in .trellis/provenance.jsonl so commit messages stay clean.
# See the Trellis standard (ADR-0005, ADR-0009: https://github.com/e-onux/trellis/tree/main/tech/decisions).
#
# Opt-in: while allowed_models (and disallow) are empty, the check is NOT evaluated - it neither
# passes nor blocks, and the AGENTS.md "authorized models" rule does not apply. List at least one
# model id to turn the gate on; the settings below then take effect.
version: "0.1"

# Allow-list of model ids permitted to author commits. A commit whose recorded model is not
# in this list (and is present) is a violation. Keep this to the capable, intended models;
# the point is to stop a degraded fallback from silently shipping code. Example:
# allowed_models:
#   - vendor-model-version
allowed_models: []

# Optional explicit block-list (documents intent and catches a model that is otherwise on a
# shared allow-list). A non-empty block-list alone also turns the check on. Example:
# disallow:
#   - a-known-weak-fallback-model
disallow: []

# Once configured - fail-closed: a commit in the enforcement window with no recorded provenance
# is a violation. Set to false to only flag commits whose recorded model is disallowed.
require_provenance: true

# Enforcement window. Commits at or before this point are exempt (you do not retroactively
# stamp history). Accepts a date (YYYY-MM-DD, matched with `git --since`) or a git ref/range base.
# Set it to the day you opt in - left unset, every commit in history is checked.
# enforce_since: "YYYY-MM-DD"

# Once configured - block = a violation fails `trellis model-check` (non-zero exit) so CI/pre-push
# can block the merge before bad-model code lands. warn = report only, never fail. Reverting code
# that already landed is intentionally NOT automatic - blocking before merge is safer; see ADR-0005.
enforcement: block
