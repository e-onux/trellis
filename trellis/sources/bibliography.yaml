# Bibliography - evidence records for this repository's own decisions.
# Validated against standard/schemas/source.schema.json.
sources:
  - id: source-0001
    title: "AGENTS.md - a simple, open format for guiding coding agents"
    type: official-documentation
    url: https://agents.md/
    license: unknown
    local_copy:
      path: null
      sha256: null
    supports:
      - ADR-0002
    relevance:
      claim: >
        AGENTS.md is a cross-tool instruction format stewarded under the Linux Foundation's
        Agentic AI Foundation and read natively by Codex, Cursor, Copilot, Gemini CLI, Aider,
        Windsurf, Zed and others, with tens of thousands of adopting repositories as of mid-2026.
      confidence: high
      limitations:
        - "Adoption figures move quickly; revisit at review time."
    last_verified: 2026-06-12
    next_review: 2027-06-12
  - id: source-0002
    title: "OWASP Top 10 - the standard awareness document for web application security risks"
    type: standard
    url: https://owasp.org/www-project-top-ten/
    license: CC-BY-SA-4.0
    local_copy:
      path: null
      sha256: null
    supports:
      - ADR-0006
    relevance:
      claim: >
        OWASP Top 10 is the widely-adopted reference for the most critical web application security
        risks (injection, broken access control, security misconfiguration, vulnerable components,
        cryptographic failures), and frames the core principles of the security manifesto.
      confidence: high
      limitations:
        - "Web-app oriented; complement with the LLM Top 10 for AI features."
    last_verified: 2026-06-18
    next_review: 2027-06-18
  - id: source-0003
    title: "OWASP Top 10 for LLM Applications"
    type: standard
    url: https://genai.owasp.org/llm-top-10/
    license: CC-BY-SA-4.0
    local_copy:
      path: null
      sha256: null
    supports:
      - ADR-0006
    relevance:
      claim: >
        The OWASP Top 10 for LLM Applications catalogues prompt injection (LLM01), sensitive
        information disclosure (LLM02) and excessive agency (LLM06), which back the llm-app section
        of the security manifesto.
      confidence: high
      limitations:
        - "A young, fast-moving list; revisit at review time."
    last_verified: 2026-06-18
    next_review: 2027-06-18
  - id: source-0004
    title: "CISA - Secure by Design"
    type: official-documentation
    url: https://www.cisa.gov/securebydesign
    license: unknown
    local_copy:
      path: null
      sha256: null
    supports:
      - ADR-0006
    relevance:
      claim: >
        CISA's Secure by Design principles (take ownership of security outcomes, default-secure
        configurations, build security in rather than bolt it on) frame the manifesto's posture of
        fail-closed defaults and security-sensitive human-approval gates.
      confidence: high
      limitations:
        - "Principles, not a checklist; operationalized here as the manifesto + secret-scan gate."
    last_verified: 2026-06-18
    next_review: 2027-06-18
  - id: source-0005
    title: "SQLite As An Application File Format"
    type: official-documentation
    url: https://www.sqlite.org/appfileformat.html
    license: public-domain
    local_copy:
      path: null
      sha256: null
    supports:
      - ADR-0008
      - reuse-inventory
      - migrate-reuse-inventory
    relevance:
      claim: >
        An SQLite database is a single, easily moved file with atomic transactions, incremental
        updates and a high-level query language - the properties the inventory relies on after
        migration (one tracked artifact, safe writes, and queries that fetch only candidate rows).
      confidence: high
      limitations:
        - "Written about application documents; it does not address reviewing or merging a binary file in Git - Trellis adds a record-level diff/merge for that."
    last_verified: 2026-09-25
    next_review: 2027-09-25
  - id: source-0006
    title: "Node.js documentation - SQLite (node:sqlite), added in v22.5.0"
    type: official-documentation
    url: https://nodejs.org/api/sqlite.html
    license: MIT
    local_copy:
      path: null
      sha256: null
    supports:
      - ADR-0008
    relevance:
      claim: >
        The built-in node:sqlite module first shipped in Node.js v22.5.0, so it is unavailable on the
        Node >= 18 range Trellis supports; a WASM driver is needed until the minimum rises.
      confidence: high
      limitations:
        - "Re-check the module's stability index and the project's minimum Node version at review time."
    last_verified: 2026-09-25
    next_review: 2027-09-25
